; ============================================================
; دایال‌پلن پیجینگ
; هر تماسی که به context زیر برسد (یعنی تماس با اکستنشن پیج)،
; جواب داده می‌شود، یک بوق پخش می‌شود و صدای تماس با MixMonitor
; به یک named pipe (FIFO) استریم می‌شود که Liquidsoap آن را
; می‌خواند و روی آمپلی‌فایر پخش می‌کند.
; ============================================================

[paging-in]
; اگر از OPTION A استفاده می‌کنید، شماره 100 را با شماره واقعی
; اکستنشنی که از سانترال گرفته‌اید هماهنگ کنید.
exten => 100,1,NoOp(== تماس پیجینگ دریافت شد ==)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Set(PAGEFIFO=/tmp/paging/page_audio.sln)
 same => n,System(mkfifo ${PAGEFIFO} 2>/dev/null; true)
 same => n,MixMonitor(${PAGEFIFO})
 ; حداکثر مدت مجاز یک پیام پیجینگ (ثانیه) - برای جلوگیری از باز ماندن خط
 same => n,Wait(120)
 same => n,StopMixMonitor()
 same => n,Hangup()

exten => h,1,System(rm -f /tmp/paging/page_audio.sln 2>/dev/null; mkfifo /tmp/paging/page_audio.sln 2>/dev/null; true)
