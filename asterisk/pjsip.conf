; ============================================================
; پیکربندی PJSIP برای سیستم پیجینگ
; این فایل به‌صورت include از pjsip.conf اصلی Asterisk خوانده می‌شود.
; فقط یکی از دو حالت زیر (A یا B) را فعال نگه دارید؛ آن‌یکی که استفاده
; نمی‌کنید را با ; کامنت کنید یا حذف کنید.
; ============================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ------------------------------------------------------------
; OPTION A (پیشنهادی): این سرور مثل یک تلفن SIP روی سانترال/PBX
; موجود شما (مثلاً Grandstream UCM / Elastix / 3CX / FreePBX) با
; یک اکستنشن رجیستر می‌شود. مقادیر زیر را از ادمین سانترال بگیرید.
; ------------------------------------------------------------

[pbx_registration]
type=registration
transport=transport-udp
outbound_auth=pbx_auth
server_uri=sip:PBX_IP_OR_DOMAIN         ; آدرس سانترال، مثلا sip:192.168.1.10
client_uri=sip:100@PBX_IP_OR_DOMAIN     ; شماره اکستنشن پیج، مثلا 100
retry_interval=20
max_retries=0
expiration=3600

[pbx_auth]
type=auth
auth_type=userpass
username=100                     ; شماره اکستنشن روی سانترال
password=CHANGE_ME_STRONG_PASS   ; پسورد اکستنشن روی سانترال

[pbx_aor]
type=aor
contact=sip:PBX_IP_OR_DOMAIN
qualify_frequency=30

[pbx_identify]
type=identify
endpoint=pbx_endpoint
match=PBX_IP_OR_DOMAIN            ; آی‌پی یا دامنه سانترال (برای شناسایی تماس ورودی از آن)

[pbx_endpoint]
type=endpoint
transport=transport-udp
context=paging-in                 ; همه‌ی تماس‌های ورودی از سانترال به این context می‌روند
disallow=all
allow=ulaw
allow=alaw
outbound_auth=pbx_auth
aors=pbx_aor
from_user=100
direct_media=no

; ------------------------------------------------------------
; OPTION B: اگر سانترال/PBX جداگانه‌ای ندارید و می‌خواهید تلفن‌های
; دفتر مستقیماً به همین سرور رجیستر شوند، این بخش را فعال کنید و
; بخش OPTION A بالا را غیرفعال (کامنت) کنید. اکستنشن پیج شماره
; 100 است؛ اکستنشن‌های دیگر (101، 102، ...) را برای تلفن‌های دفتر
; به همین شکل تکرار کنید.
; ------------------------------------------------------------

;[100-endpoint]
;type=endpoint
;transport=transport-udp
;context=paging-in
;disallow=all
;allow=ulaw
;allow=alaw
;auth=100-auth
;aors=100-aor
;direct_media=no
;
;[100-auth]
;type=auth
;auth_type=userpass
;username=100
;password=CHANGE_ME_STRONG_PASS
;
;[100-aor]
;type=aor
;max_contacts=1
;remove_existing=yes
