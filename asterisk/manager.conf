; ============================================================
; AMI اختیاری است — برای عملکرد اصلی سیستم (پیج/رادیو/موزیک) لازم
; نیست. اگر بعداً خواستید پنل وب وضعیت زنده تماس پیج (کسی در حال
; پیج کردن است یا نه) را نشان دهد، از این کاربر AMI استفاده کنید.
; ============================================================

[paging_ami]
secret = CHANGE_ME_AMI_PASS
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = call,system
write =
