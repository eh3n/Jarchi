<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarchi 📣</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <div class="brand"><span class="brand-dot"></span><span class="brand-name" data-i18n="app"></span></div>
      <nav class="mainnav"></nav>
    </div>
    <div class="topbar-right">
      <span class="clock" id="clock">--:--:--</span>
      <select id="langSelect" class="lang-select"></select>
      <button class="theme-toggle" id="themeToggle">☀️</button>
      <button id="logoutBtn" style="font-size:12px;" data-i18n="logout"></button>
    </div>
  </div>
  <div class="container">
    <div class="card full">
      <h2 data-i18n="add_station"></h2>
      <div class="form-inline">
        <input type="text" id="stationName" data-i18n-ph="st_name" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <input type="url" id="stationUrl" data-i18n-ph="st_url" style="direction:ltr;" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url" />
        <button id="addStationBtn" class="btn-primary" data-i18n="upload"></button>
      </div>
    </div>
    <div class="card full">
      <h2 data-i18n="search_radio"></h2>
      <div class="form-inline">
        <input type="text" id="rbQuery" data-i18n-ph="search_ph" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button id="rbSearchBtn" class="btn-primary" data-i18n="check"></button>
      </div>
      <div id="rbResults"></div>
    </div>

    <div class="card full">
      <h2 data-i18n="stations_list"></h2>
      <div id="stationsList"></div>
    </div>
  </div>
<script src="/js/common.js"></script>
<script src="/js/radio.js"></script>
</body>
</html>
