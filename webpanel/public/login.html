<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarchi 📣</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name" data-i18n="app"></span>
        </div>
        <select id="langSelect" class="lang-select"></select>
      </div>
      <p class="subtitle" data-i18n="login_sub"></p>
      <form id="loginForm">
        <label for="username" data-i18n="username"></label>
        <input type="text" id="username" autocomplete="username" required />
        <label for="password" data-i18n="password"></label>
        <input type="password" id="password" autocomplete="current-password" required />
        <button type="submit" class="btn btn-primary btn-block" data-i18n="login"></button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>
  </div>
<script src="/js/common.js"></script>
<script>
initTheme(); initLangSelect(); applyI18n(); renderFooter();
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = $("errorMsg");
  errorEl.textContent = "";
  try {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("username").value.trim(), password: $("password").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "!");
    window.location.href = "/dashboard.html";
  } catch (err) { errorEl.textContent = err.message; }
});
</script>
</body>
</html>
