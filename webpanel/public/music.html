<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarchi 📣</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <div class="brand"><span class="brand-dot"></span><span class="brand-name" data-i18n="app"></span></div>
      <nav class="mainnav"></nav>
    </div>
    <div class="topbar-right">
      <span class="clock" id="clock">--:--:--</span>
      <select id="langSelect" class="lang-select"></select>
      <button class="theme-toggle" id="themeToggle">☀️</button>
      <button id="logoutBtn" style="font-size:12px;" data-i18n="logout"></button>
    </div>
  </div>
  <div class="container">
    <div class="card full">
      <h2 data-i18n="add_music"></h2>
      <div class="form-inline">
        <input type="file" id="trackFiles" multiple accept=".mp3,.wav,.ogg,.flac,.m4a" />
        <button id="uploadTracksBtn" class="btn-primary" data-i18n="upload"></button>
      </div>
      <div class="status-line" id="uploadStatus"></div>
    </div>
    <div class="card full">
      <h2 data-i18n="tracks_list"></h2>
      <div id="tracksList"></div>
    </div>
  </div>
<script src="/js/common.js"></script>
<script src="/js/music.js"></script>
</body>
</html>
