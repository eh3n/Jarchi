<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarchi 📣</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <div class="brand"><span class="brand-dot"></span><span class="brand-name" data-i18n="app"></span></div>
      <nav class="mainnav"></nav>
    </div>
    <div class="topbar-right">
      <span class="clock" id="clock">--:--:--</span>
      <select id="langSelect" class="lang-select"></select>
      <button class="theme-toggle" id="themeToggle">☀️</button>
      <button id="logoutBtn" style="font-size:12px;" data-i18n="logout"></button>
    </div>
  </div>
  <div class="container">
    <div class="engine-banner" id="engineBanner"></div>

    <div class="card full">
      <h2 data-i18n="now_playing"></h2>
      <div class="player">
        <div class="cover" id="npCover">🎵</div>
        <div class="player-info">
          <p class="np-title"><span id="npTitle">...</span><span class="eq" id="npEq" style="display:none;"><span></span><span></span><span></span></span></p>
          <p class="np-artist" id="npArtist">—</p>
          <div class="progress" id="npProgress"><div class="progress-fill" id="npFill"></div></div>
          <div class="np-times"><span id="npElapsed"></span><span id="npDuration"></span></div>
          <div class="transport">
            <button id="btnPrev" title="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12l-9-6z"/></svg></button>
            <button id="btnPlayStop" class="big" title="play/stop"><svg viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg></button>
            <button id="btnNext" title="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l9-6z"/></svg></button>
            <button id="btnMute" title="mute"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5-1l1.5 1.5L19.5 8 21 9.5 19.5 11l1.5 1.5-1.5 1.5-1.5-1.5-1.5 1.5L15 12.5l1.5-1.5L15 9.5 16.5 8z"/></svg></button>
            <button id="btnShuffle" title="shuffle"><svg viewBox="0 0 24 24"><path d="M17 4l4 3-4 3V8h-2.5l-2 2.6-1.9-2.4L12.5 6H17V4zM3 6h4.5l2.4 3.1-1.9 2.4L6 8H3V6zm14 10v-2l4 3-4 3v-2h-4.5l-9-11H3v-2h1.5l9 11H17z"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <div class="card full">
      <h2 data-i18n="select_source"></h2>
      <div class="source-buttons">
        <button data-source="radio" id="btnRadio" data-i18n="src_radio"></button>
        <button data-source="playlist" id="btnPlaylist" data-i18n="src_playlist"></button>
        <button data-source="spotify" id="btnSpotify" data-i18n="src_spotify"></button>
        <button data-source="off" id="btnOff" data-i18n="src_off"></button>
      </div>
      <label for="volumeRange" style="margin-top:20px;" data-i18n="volume"></label>
      <input type="range" id="volumeRange" min="0" max="100" value="85" style="width:100%;" />
      <div class="status-line" id="engineStatus"></div>
    </div>

    <div class="card">
      <h2 data-i18n="stations_list"></h2>
      <div class="pick-list" id="stationPick"></div>
    </div>

    <div class="card">
      <h2 data-i18n="tracks_list"></h2>
      <div class="pick-list" id="trackPick"></div>
    </div>

    <div class="card full">
      <h2 data-i18n="page_history"></h2>
      <div id="pageHistory"></div>
    </div>
  </div>
<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
